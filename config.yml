token: "TokenTimeIsBackBuddyss"  # Lichess OAuth2 Token.

engines:
  standard:
    dir: "./engines"
    name: "noksiy"
    ponder: true
    silence_stderr: false
    move_overhead_multiplier: 20.0
    uci_options:
      Threads: 4
      Hash: 1024
      Move Overhead: 100
    limits:
      # time: 20.0
      # depth: 50
      # nodes: 8000000

syzygy:
  standard:
    enabled: false
    paths:
      - "./engines/syzygy"
    max_pieces: 7
    instant_play: true
  antichess:
    enabled: false
    paths:
      - "/path/to/antichess/syzygy"
    max_pieces: 6
    instant_play: true
  atomic:
    enabled: false
    paths:
      - "/path/to/atomic/syzygy"
    max_pieces: 6
    instant_play: true

gaviota:
  enabled: false
  paths:
    - "/path/to/gaviota"
  max_pieces: 5

opening_books:
  enabled: false
  priority: 900
  books:
#   standard:
#     selection: weighted_random          # Move selection is one of "weighted_random", "uniform_random" or "best_move".
#     max_depth: 16                       # Half move max depth. (Comment this line for max depth)
#     names:                              # List of names of books to use if there is no specific book for the time control, white, black or chess960
#       - DefaultBook    
    standard_black:
      selection: weighted_random
 
    # max depth : 69 
      names:
        - Win
    standard_white:
      selection: weighted_random 
    # max depth : 69 
      names:
        - Stay
        - White
        - Black
        - Optimus

    chess960: 
      selection: best_move 
      names: 
        - Chess960
    chess960_white: 
      selection: best_move 
      names: 
        - Ches
        - White1
        - White2


    chess960_black: 
      selection: best_move 
      names: 
        - Ches
        - Black1
        - Black2
        
    humans: 
      selection: best_move 
      names: 
        - Torma
        - Titans

online_moves:
  opening_explorer:
    enabled: false
    priority: 300
    only_without_book: false
    use_for_variants: true
    min_time: 20
    timeout: 5
    min_games: 10
    only_with_wins: true
    selection: "win_rate"
    anti: true
    # max_depth: 20

  lichess_cloud:
    enabled: false
    priority: 200
    only_without_book: false
    min_eval_depth: 20
    min_time: 10
    timeout: 3
    # max_depth: 30

  chessdb:
    enabled: false                         # Activate online moves from chessdb.cn/queryc_en/
    priority: 100                         # Priority with which this move source is used. Higher priority is used first.
    only_without_book: false              # Whether the chessdb should only be used if there is no matching book.
    min_candidates: 5                     # Minimum number of candidate moves.
    min_time: 20                          # Time the bot must have at least to use the online move. +10 seconds in games without increment.
    timeout: 5                            # Time the server has to respond.
    selection: "best"                     # Move selection is one of "optimal", "best" or "good".
    max_depth: 30
    
  online_egtb:
    enabled: false
    min_time: 5
    timeout: 3

offer_draw:
  enabled: true
  score: 20
  consecutive_moves: 5
  min_game_length: 31
  against_humans: false

resign:
  enabled: true
  score: -1000
  consecutive_moves: 6
  against_humans: false



