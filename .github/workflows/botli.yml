name: Run botli

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: "Upgrade to a Lichess bot account?"
        required: false
        type: boolean
        default: false
      matchmaking:
        description: "Enable matchmaking?"
        required: true
        type: boolean
        default: true
      additional_command:
        description: "Optional commands to pass (wrap in quotes)"
        required: false
        default: ""
      never_stop:
        description: "Never stop matchmaking unless it stops itself"
        required: false
        type: boolean
        default: true
      stop_seconds:
        description: "Seconds to wait before sending stop command (ignored if never_stop ticked)"
        required: false
        default: ""

  push:
    branches:
      - main
    paths:
      - user_interface.py

  schedule:
    - cron: "0 */2 * * *"

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # =========================
      # STOCKFISH 18 (OFFICIAL)
      # =========================
     

      - name: Inject Secret Token
        run: sed -i "s/TokenTimeIsBackBuddyss/${{ secrets.LICHESS_KEY }}/g" config.yml

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Noksiy permission
        run: chmod +x ./engines/noksiy

      - name: Cancel previous runs
        run: |
          CURRENT_RUN_ID=${{ github.run_id }}
          RUNS=$(gh run list --workflow "Run botli" --status in_progress --json databaseId --jq ".[].databaseId" | grep -v "$CURRENT_RUN_ID" || true)
          for RUN_ID in $RUNS; do
            gh run cancel "$RUN_ID"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Bot
        run: |
          CMD='python3 -u user_interface.py "tournament kVKuvLSY"'

          [ "${{ github.event.inputs.upgrade }}" = "true" ] && CMD="$CMD --upgrade"
          [ "${{ github.event.inputs.matchmaking }}" = "true" ] && CMD="$CMD matchmaking"

          if [ -n "${{ github.event.inputs.additional_command }}" ]; then
            CMD="$CMD ${{ github.event.inputs.additional_command }}"
          fi

          echo "Running: $CMD"
          eval "$CMD" &
          BOT_PID=$!

          if [ "${{ github.event.inputs.matchmaking }}" = "true" ] && \
             [ "${{ github.event.inputs.never_stop }}" != "true" ] && \
             [[ "${{ github.event.inputs.stop_seconds }}" =~ ^[0-9]+$ ]]; then
            sleep "${{ github.event.inputs.stop_seconds }}"
            python3 -u user_interface.py stop
          fi

          sleep 21000
          kill -SIGTERM $BOT_PID || true
          wait $BOT_PID
